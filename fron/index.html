<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo pedido · CelularesVR</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <nav class="navbar">
    <span class="marca">📱 CelularesVR</span>
    <a href="index.html">Nuevo pedido</a>
    <a href="tablero.html">Tablero</a>
    <a href="estadisticas.html">Estadísticas</a>
  </nav>

  <main class="contenedor">
    <h1>Nuevo pedido</h1>

    <div class="selector-cliente">
      <label for="select-cliente">Cliente</label>
      <select id="select-cliente"></select>
    </div>

    <div class="layout-pedido">
      <section id="catalogo" class="grilla"></section>

      <aside class="panel-resumen">
        <h2>Resumen del pedido</h2>
        <div id="resumen"></div>
        <button id="btn-confirmar" class="btn-confirmar" disabled>Confirmar pedido</button>
        <p id="mensaje" class="mensaje"></p>
      </aside>
    </div>
  </main>

  <script type="module" src="js/index.js"></script>

</html>
